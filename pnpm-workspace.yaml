packages:
  - frontend
  - backend
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
overrides:
  next: ^16.4.2
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/node': ^22.20.2
  validator: ^13.15.35
  nodemailer: ^10.1.4
  qs: ^6.16.1
  'brace-expansion@^1.0.0': ^1.1.21
  'brace-expansion@^2.0.0': ^2.1.7
  'brace-expansion@^5.0.0': ^5.0.12
  'fast-uri@^3.0.0': ^3.1.9
  'dompurify@^3.0.0': ^3.4.17
  'js-yaml@^4.0.0': ^4.3.2
  'ajv@^8.0.0': ^8.20.0
  '@nestjs/platform-express>multer': ^2.5.0
  'body-parser@^2.0.0': ^2.4.0
  'zod@^4.0.0': ^4.6.6
  # Next 16.3 pins typescript-eslint 8.68.0, whose parser lacks ESLint 10 scope support.
  'eslint-config-next>typescript-eslint': 8.70.0
  # Istanbul only uses load(); YAML 4 removes argparse 1 and vulnerable sprintf-js.
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2
  'source-map-js@^1.2.1': 1.2.2
  'proxy-addr@^2.0.7': 2.0.8
  sharp: 0.35.5
  'concurrently>shell-quote': 1.12.0
  'handlebars@^4.7.9': 4.7.10
  # The patched Next lint helper uses glob instead of the vulnerable braces chain.
  '@next/eslint-plugin-next@16.3.8>fast-glob': '-'
  'path-to-regexp@^6.0.0': ^6.3.0
  'undici@^5.0.0': ^5.29.0
auditConfig:
  ignoreGhsas:
    # deepmerge has no patched release; reachable only via backend jest (dev-only), low severity.
    - GHSA-gcqx-w48m-w2h4
    # zod 3 has no patched release; next-cloudinary 6 (url-loader 5) only safeParses short
    # flag strings against enums, never oversized collections. Drop once on next-cloudinary 7.
    - GHSA-mrhx-c7xc-m3w5
packageExtensions:
  '@next/eslint-plugin-next@16.3.8':
    dependencies:
      glob: 13.0.6
      minimatch: 10.2.6
      picomatch: 4.0.7
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
updateConfig:
  ignoreDependencies:
    - '@nestjs/config' # v12 is ESM-only; this CommonJS backend would require a broad ESM module/import conversion.
    - '@nestjs/typeorm' # v12 is ESM-only; this CommonJS backend would require a broad ESM module/import conversion.
    - '@nestjs/common' # Keep Nest core stack on v11; Nest throttler and nest-winston support only through v11.
    - '@nestjs/core' # Keep Nest core stack on v11; Nest throttler and nest-winston support only through v11.
    - '@nestjs/platform-express' # Keep Nest core stack on v11; Nest throttler and nest-winston support only through v11.
    - '@nestjs/testing' # Keep Nest core stack on v11; Nest throttler and nest-winston support only through v11.
minimumReleaseAgeExclude:
  # Security fix published within the normal seven-day release age.
  - 'handlebars@4.7.10'
  # Use the current security patch across Next and its platform packages.
  - 'next@16.3.8'
  - 'eslint-config-next@16.3.8'
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@clerk/backend@3.17.2'
  - '@clerk/nextjs@7.9.2'
  - '@clerk/react@6.15.2'
  - '@clerk/shared@4.31.1'
  - '@nestjs/cli@12.0.0'
  - '@nestjs/schematics@12.0.1'
  - '@nestjs/common@11.2.3'
  - '@nestjs/core@11.2.3'
  - '@nestjs/platform-express@11.2.3'
  - '@nestjs/testing@11.2.3'
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - '@posthog/browser-common@0.8.3'
  - '@posthog/core@1.53.2'
  - '@posthog/types@1.411.1'
  - '@types/node@22.20.2'
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - '@vercel/build-utils@14.4.0'
  - '@vercel/error-utils@2.2.1'
  - '@vercel/node@7.0.0'
  - eslint-config-next@16.3.5
  - file-type@22.1.0
  - libphonenumber-js@1.13.13
  - next@16.3.5
  - next-cloudinary@6.19.0
  - nodemailer@10.0.8
  - pnpm@12.4.1
  - posthog-js@1.430.2
  - '@playwright/test@1.63.0'
  - react@19.3.0
  - react-dom@19.3.0
  - prettier@3.9.6
  - stripe@22.6.2
  - scheduler@0.28.0
  - typescript-eslint@8.70.0
patchedDependencies:
  '@next/eslint-plugin-next@16.3.8': patches/@next__eslint-plugin-next@16.3.8.patch
