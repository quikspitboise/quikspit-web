name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quikspit_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/quikspit_ci
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:3001
      ENABLE_FILE_LOGGING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm --filter backend test --runInBand
      - run: pnpm --filter backend test:postgres
      - run: pnpm --filter frontend test
      - run: pnpm --filter backend exec eslint "{src,apps,libs,test}/**/*.ts"
      - run: pnpm --filter frontend lint
      - run: pnpm build
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - run: pnpm --filter frontend test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --json > audit-production.json
      - name: Full dependency and tooling audit
        if: always()
        run: pnpm audit --json > audit-all.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audits
          path: audit-*.json
          retention-days: 14
